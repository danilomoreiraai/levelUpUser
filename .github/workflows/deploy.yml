name: Release container images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested main images
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE }}
          persist-credentials: false

      - name: Resolve image names
        id: images
        run: |
          registry_path="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'site=%s-site\npersonal_link=%s-personal-link\n' "$registry_path" "$registry_path" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Personal Link
        id: personal_link
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/personal-link
          push: true
          tags: ${{ steps.images.outputs.personal_link }}:${{ env.RELEASE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_RELEASE=${{ env.RELEASE }}
            VITE_LEVELUP_SITE_ORIGIN=${{ vars.VITE_LEVELUP_SITE_ORIGIN }}

      - name: Build and publish the portfolio
        id: site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.images.outputs.site }}:${{ env.RELEASE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_APP_RELEASE=${{ env.RELEASE }}
            VITE_PERSONAL_LINK_ORIGIN=${{ vars.VITE_PERSONAL_LINK_ORIGIN }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0' }}
            VITE_GA_MEASUREMENT_ID=${{ vars.VITE_GA_MEASUREMENT_ID }}
            VITE_META_PIXEL_ID=${{ vars.VITE_META_PIXEL_ID }}
            VITE_PRIVACY_CONTACT_EMAIL=${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
            VITE_OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.VITE_OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Record image digests for Coolify
        env:
          PERSONAL_LINK_IMAGE: ${{ steps.images.outputs.personal_link }}@${{ steps.personal_link.outputs.digest }}
          SITE_IMAGE: ${{ steps.images.outputs.site }}@${{ steps.site.outputs.digest }}
        run: |
          {
            printf '### Images for %s\n\n' "$RELEASE"
            printf -- '- Personal Link: `%s`\n' "$PERSONAL_LINK_IMAGE"
            printf -- '- Portfolio: `%s`\n' "$SITE_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
