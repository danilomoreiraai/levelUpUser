name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  trigger-easypanel:
    name: Trigger Easypanel rebuild
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      EASYPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Skip when webhook is not configured
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL == '' }}
        run: echo "EASYPANEL_DEPLOY_WEBHOOK_URL is not configured."

      - name: Trigger rebuild webhook
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$EASYPANEL_DEPLOY_WEBHOOK_URL"
