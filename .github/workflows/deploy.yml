name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  trigger-easypanel:
    name: Trigger Easypanel rebuild
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      EASYPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_URL }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Skip when webhook is not configured
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL == '' }}
        run: echo "EASYPANEL_DEPLOY_WEBHOOK_URL is not configured."

      - name: Trigger rebuild webhook
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$EASYPANEL_DEPLOY_WEBHOOK_URL"

      - name: Skip Docker service refresh when VPS secrets are not configured
        if: ${{ env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_SSH_PRIVATE_KEY == '' }}
        run: echo "VPS SSH secrets are not fully configured."

      - name: Refresh Docker services on VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail

          SSH_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/easypanel_deploy_key
          chmod 600 ~/.ssh/easypanel_deploy_key
          ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          # Give Easypanel time to accept the deploy trigger before refreshing services.
          sleep 30

          ssh \
            -i ~/.ssh/easypanel_deploy_key \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash -lc '"'"'
              set -euo pipefail
              docker service update --endpoint-mode dnsrr personal_projects_level_user
              docker service update --force easypanel-traefik
            '"'"''
