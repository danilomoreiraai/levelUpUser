name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate push commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  validate:
    name: Static analysis, unit tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite
        run: npm run validate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  end-to-end:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  personal-link:
    name: Personal Link validation and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/personal-link
    env:
      TEST_DATABASE_URL: postgresql://personal_link:personal_link_ci_only@127.0.0.1:5432/personal_link_test
      VITE_LEVELUP_SITE_ORIGIN: https://levelupuser.com
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: personal_link
          POSTGRES_PASSWORD: personal_link_ci_only
          POSTGRES_DB: personal_link_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_link -d personal_link_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/personal-link/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run validate

      - name: Run mutation tests
        env:
          TEST_DATABASE_URL: ""
        run: npm run test:mutation

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: personal-link-playwright-report
          path: apps/personal-link/playwright-report/
          retention-days: 14
